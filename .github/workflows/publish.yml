name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Regenerate HTML
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -c "
          from src.nerpatham_hub.config import load
          from src.nerpatham_hub.sitegen import SiteGen
          cfg = load()
          sg = SiteGen(cfg)
          print(f'site root: {sg.site}')
          count=0
          for p in sorted(sg.site.rglob('*.md')):
              rel = p.relative_to(sg.site).as_posix()
              if rel.startswith('src/') or rel.startswith('.github/'): continue
              parts = rel.split('/')
              if len(parts)!=3: continue
              if parts[0] in ('src', '.github'): continue
              sg.render_article(cfg, rel)
              count+=1
          print(f'rendered {count} articles')
          sg.regenerate_indexes(cfg)
          print('regenerated indexes')
          "

      - name: Copy static site to _site (exclude src/.github/config)
        run: |
          mkdir -p _site
          # copy only the static output, NOT src/ or .github/ or config
          cp -r ml/ _site/
          cp -r assets/ _site/
          cp index.html index.json rss.xml sitemap.xml robots.txt llms.txt style.css .nojekyll _site/
          # verify no source leaked
          if [ -d "_site/src" ]; then echo "ERROR: src leaked into _site"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
